<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Psychrometric Studio — moist-air analysis for real buildings</title>
    <meta
      name="description"
      content="A psychrometric chart that solves an air-handling chain, checks it against ASHRAE 55 comfort, and counts a year of weather against it. Runs entirely in your browser: no account, no upload."
    />
    <meta name="author" content="Pease Studio" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0C2A24" />

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/psychrometric-studio-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/psychrometric-studio-favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/psychrometric-studio-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      The custom domain is settled, so the canonical can finally be stated. The
      tool also answers on its *.pages.dev address, and without this both hosts
      are indexable copies of the same page competing with each other.
    -->
    <link rel="canonical" href="https://psychrometric.peasestudio.com/" />

    <!--
      Social preview. A 1200x630 card drawn for the purpose, which replaces the
      square app icon that stood in while there was none: the earlier note said
      a card cropped from artwork never drawn for it was worse than a square,
      and it was — this one is not cropped from anything.

      og:image is absolute. A root-relative path is resolved against the
      unfurler's own host by several of them, which fetches nothing.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Psychrometric Studio" />
    <meta property="og:title" content="Psychrometric Studio" />
    <meta property="og:url" content="https://psychrometric.peasestudio.com/" />
    <meta
      property="og:description"
      content="Solve an air-handling chain on a psychrometric chart, check it against ASHRAE 55, and count a year of weather against it. Everything runs in your browser."
    />
    <meta property="og:image" content="https://psychrometric.peasestudio.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      No analytics, no fonts, no tags. The tool has no accounts and keeps
      nothing; loading a third-party script would quietly make that untrue.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif; line-height: 1.6">
        Psychrometric Studio needs JavaScript. Every calculation happens in your
        browser rather than on a server — which is what lets the tool work
        without an account, and without your design leaving your machine.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
