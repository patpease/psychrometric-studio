name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web — engine and validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify the vendored calculation basis
        # Runs first and fails the build if psychrolib.js has changed without a
        # deliberate re-vendor. The calculation basis is stamped on every export;
        # it must never drift silently.
        run: ../scripts/vendor-psychrolib.sh

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test (includes the ASHRAE reference-value gate)
        run: npm test

      - name: Build
        # The deployed artefact. Runs last because it is the slowest and the
        # least informative when something is wrong — but it must run, because
        # the type check does not exercise Vite's module resolution, and that is
        # exactly where this project has been bitten before (ADR 0003).
        run: npm run build

      - name: Check the generated files are committed
        # `build` regenerates the icon module and the third-party notices. If
        # either differs from what is in the tree, someone changed an SVG or a
        # dependency without regenerating — and the committed version is what a
        # reader of the repository sees.
        run: git diff --exit-code -- src/icons/generated.ts public/third-party-notices.txt ../THIRD-PARTY-NOTICES.md

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Test
        run: pytest -q
